apiVersion: v1
kind: Secret
metadata:
  name: github-runner-cloud-init
  # Must match the Supervisor namespace where you deploy the VM
  namespace: mg-ns-01
type: Opaque
stringData:
  user-data: |
    #cloud-config
    users:
      - name: runner
        # Adds the runner to sudo and docker groups
        groups: sudo, docker
        shell: /bin/bash
        sudo: ['ALL=(ALL) NOPASSWD:ALL']
        # Update the below with your SSH Pub key
        ssh_authorized_keys:
          - [YOUR SSH PUBLIC KEY HERE]
    runcmd:
      # 1. Install prerequisites required by GitHub Actions and the runner agent
      - apt-get update && apt-get -y install curl jq git docker.io
      # 2. Create the runner directory
      - su - runner -c "mkdir -p ~/actions-runner"
      # 3. Download and extract the GitHub runner package (Update the URL/Version to match GitHub's current release)
      - su - runner -c 'cd ~/actions-runner && curl -o actions-runner-linux.tar.gz -L "https://github.com/actions/runner/releases/download/v2.338.2/actions-runner-linux-x64-2.338.2.tar.gz"'
      - su - runner -c "cd ~/actions-runner && tar xzf ./actions-runner-linux.tar.gz"
      # Install dependencies as root before configuring
      - cd /home/runner/actions-runner && ./bin/installdependencies.sh
      # 4. Configure the runner non-interactively - insert your own repo and token from GitHub
      - su - runner -c "cd ~/actions-runner && ./config.sh --url https://github.com/[YOUR REPO PATH HERE] --token [YOUR TOKEN HERE] --unattended --replace --name kubevm-runner-01"
      # 5. Install and start the runner as a persistent system service
      - cd /home/runner/actions-runner && ./svc.sh install runner
      - cd /home/runner/actions-runner && ./svc.sh start